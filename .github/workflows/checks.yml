name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The eval attestation matches these files
        run: node evals/attest.mjs verify
      - name: Hook unit tests
        run: node --test hooks/*.test.mjs
